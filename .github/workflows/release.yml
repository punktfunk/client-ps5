# A version tag builds the title as CI's console job does and attaches the zip, its checksum and
# the unstripped ELF (for symbolize.py) to a GitHub pre-release. The binary links
# GPL-3.0-or-later pieces, so it is GPL-3.0-or-later and its zip carries the license text
# (docs/pins.md). Promote the release by hand once a tester has run it on a console.
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  title:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain image
        run: docker build -t punktfunk-ps5-toolchain:1 -f docker/Dockerfile docker
      - uses: actions/cache@v4
        with:
          path: .toolchains
          key: toolchains-${{ hashFiles('scripts/pins.env') }}
      - name: Package
        run: |
          docker run -d --name ps5 -v "$PWD:/w" -w /w -e TITLE_ID=PPSA99724 -e PKG_VERSION="${GITHUB_REF_NAME#v}" punktfunk-ps5-toolchain:1 sleep infinity
          docker exec ps5 task toolchain
          docker exec ps5 task skia
          docker exec ps5 task package
      - uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          body: |
            Install: download `PPSA99724.zip` and follow [`docs/install.md`](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/docs/install.md).

            The source is MIT OR Apache-2.0. This binary links GPL-3.0-or-later code from PS5_Vulkan and PS5_PayloadSDK, so the binary is GPL-3.0-or-later: `COPYING` and the notices are in the zip. Its source is this repository at this tag and the revisions [`scripts/pins.env`](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/scripts/pins.env) names.
          files: |
            dist/*.zip
            dist/*.zip.sha256
            dist/*.llvm-pie.elf
            THIRD-PARTY-NOTICES.txt
